{% extends 'base.html' %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem;">
  <h1 style="font-size: 5rem; font-weight: 800; color: #ef4444;">404</h1>
  <h2 style="margin-bottom: 1rem;">Page Not Found</h2>
  <p style="color: var(--text-secondary); margin-bottom: 2rem;">The page or study room you are looking for does not exist or has been moved.</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary"><i class="fa-solid fa-home"></i> Back to Safety</a>
</div>
{% endblock %}
